name: Deploy wiki site to GitHub Pages

# 用 Quartz 把 wiki/ 构建成静态网站并发布到 GitHub Pages。
# raw/ 不参与构建，不会出现在网站上。
# 前提：仓库 Settings → Pages → Source 设为 "GitHub Actions"。

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build site
        run: bash site/build.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
